<!DOCTYPE html>
<html>
<head>
    <title>Student Registration Form</title>

    <style>
        body {
            background-color: #ffe5e2;
            font-family: "Times New Roman";
            font-size: 22px;
        }

        h1 {
            text-align: center;
            font-size: 45px;
            margin-bottom: 50px;
        }

        table {
            margin: auto;
        }

        td {
            padding: 10px;
        }

        .label {
            width: 250px;
        }

        input[type="text"],
        input[type="email"],
        input[type="password"] {
            width: 550px;
            height: 30px;
        }

        .name {
            width: 250px !important;
        }

        .small {
            width: 70px !important;
        }

        .year {
            width: 130px !important;
        }

        textarea {
            width: 550px;
            height: 100px;
        }

        select {
            width: 560px;
            height: 40px;
        }

        .button {
            text-align: center;
        }
    </style>
</head>

<body>

<h1>Student Registration Form</h1>

<form>

<table>

<tr>
    <td class="label">Roll no. :</td>
    <td>
        <input type="text">
    </td>
</tr>

<tr>
    <td>Student name :</td>
    <td>
        <input type="text" class="name" placeholder="First Name">
        -
        <input type="text" class="name" placeholder="Last Name">
    </td>
</tr>

<tr>
    <td>Father's name :</td>
    <td>
        <input type="text">
    </td>
</tr>

<tr>
    <td>Date of birth :</td>
    <td>
        <input type="text" class="small" placeholder="Day">
        -
        <input type="text" class="small" placeholder="Month">
        -
        <input type="text" class="year" placeholder="Year">
        <i>(DD-MM-YYYY)</i>
    </td>
</tr>

<tr>
    <td>Mobile no. :</td>
    <td>
        <input type="text" value="+91" style="width:45px;">
        -
        <input type="text" style="width:480px;">
    </td>
</tr>

<tr>
    <td>Email id :</td>
    <td>
        <input type="email">
    </td>
</tr>

<tr>
    <td>Password :</td>
    <td>
        <input type="password">
    </td>
</tr>

<tr>
    <td>Gender :</td>
    <td>
        <input type="radio" name="gender"> Male
        <input type="radio" name="gender"> Female
    </td>
</tr>

<tr>
    <td>Department :</td>
    <td>
        <input type="checkbox"> CSE
        <input type="checkbox"> IT
        <input type="checkbox"> ECE
        <input type="checkbox"> Civil
        <input type="checkbox"> Mech
    </td>
</tr>

<tr>
    <td>Course :</td>
    <td>
        <select>
            <option>---------------- Select Current Course's ----------------</option>
            <option>B.Tech</option>
            <option>M.Tech</option>
            <option>BCA</option>
            <option>MCA</option>
        </select>
    </td>
</tr>

<tr>
    <td>Student photo :</td>
    <td>
        <input type="file">
    </td>
</tr>

<tr>
    <td>City :</td>
    <td>
        <input type="text">
    </td>
</tr>

<tr>
    <td>Address :</td>
    <td>
        <textarea></textarea>
    </td>
</tr>

<tr>
    <td colspan="2" class="button">
        <input type="submit" value="Register">
    </td>
</tr>

</table>

</form>

</body>
</html>
